[workspace]
members = ["crates/oas-core", "crates/oas-server", "crates/oas-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/SpaceCorps/open-accounting-sweden"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
