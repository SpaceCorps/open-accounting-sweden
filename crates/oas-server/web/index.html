<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-accounting-sweden</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#667; --line:#ddd; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa; --line:#2a2f36; --accent:#6ea0ff; } }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin-top:28px; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  input,select,button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.secondary { background:transparent; color:inherit; border-color:var(--line); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; } .muted { color:var(--muted); }
  .err { color:#c0392b; } .overflow { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Time tracking</h1>
  <div id="login" class="row">
    <input id="token" type="password" placeholder="Access token" autocomplete="off">
    <button id="save">Sign in</button>
  </div>
  <p id="msg" class="muted"></p>

  <div id="app" hidden>
    <div class="row">
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
      <select id="fproject"><option value="">All projects</option></select>
      <select id="factivity"><option value="">All activities</option></select>
      <button id="refresh" class="secondary">Refresh</button>
      <button id="csv" class="secondary">Export CSV</button>
    </div>

    <h2>Overview</h2>
    <p id="total" class="muted"></p>
    <div class="overflow"><table id="byproject"></table></div>
    <div class="overflow"><table id="byactivity"></table></div>

    <h2>Entries</h2>
    <div class="overflow"><table id="entries"></table></div>

    <h2>Log time</h2>
    <div class="row">
      <select id="activity"></select>
      <input id="project" list="plist" placeholder="Project">
      <datalist id="plist"></datalist>
      <input id="date" type="date">
      <input id="start" type="time">
      <input id="end" type="time">
      <input id="message" placeholder="Message (optional)">
      <button id="log">Add</button>
    </div>
    <div class="row">
      <button id="startTimer" class="secondary">Start timer</button>
      <button id="stopTimer" class="secondary">Stop timer</button>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("oas_token") || "";

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
  });
  if (res.status === 401) { signOut("Invalid token"); throw new Error("auth"); }
  return res;
}
function signOut(text) {
  sessionStorage.removeItem("oas_token"); token = "";
  $("app").hidden = true; $("login").hidden = false; $("msg").textContent = text || "";
}
function text(el, s) { el.textContent = s; return el; }
function table(el, head, rows) {
  el.replaceChildren();
  const thead = el.createTHead().insertRow();
  thead.replaceChildren(...head.map((h) => text(document.createElement("th"), h)));
  const body = el.createTBody();
  rows.forEach((r) => { const tr = body.insertRow(); r.forEach((c) => text(tr.insertCell(), String(c ?? ""))); });
}
function query() {
  const p = new URLSearchParams();
  for (const [k, id] of [["from","from"],["to","to"],["project","fproject"],["activity","factivity"]])
    if ($(id).value) p.set(k, $(id).value);
  const s = p.toString(); return s ? "?" + s : "";
}
function fill(sel, items, first) {
  const cur = sel.value; sel.replaceChildren();
  if (first !== undefined) { const o = document.createElement("option"); o.value = ""; o.textContent = first; sel.appendChild(o); }
  items.forEach((i) => { const o = document.createElement("option"); o.value = i; o.textContent = i; sel.appendChild(o); });
  sel.value = cur;
}
async function load() {
  const [acts, projs, rep, ents] = await Promise.all([
    api("/activities").then((r) => r.json()), api("/projects").then((r) => r.json()),
    api("/time/report" + query()).then((r) => r.json()), api("/time" + query()).then((r) => r.json()),
  ]);
  if (rep.error || ents.error) { $("msg").textContent = (rep.error || ents.error).message; return; }
  $("msg").textContent = "";
  fill($("activity"), acts.activities.map((a) => a.name));
  fill($("factivity"), acts.activities.map((a) => a.name), "All activities");
  fill($("fproject"), projs.projects.filter((p) => !p.archived).map((p) => p.name), "All projects");
  $("plist").replaceChildren(...projs.projects.map((p) => { const o = document.createElement("option"); o.value = p.name; return o; }));
  $("total").textContent = rep.total_hours + " h in " + rep.entries + " entries";
  table($("byproject"), ["Project", "Hours"], Object.entries(rep.by_project));
  table($("byactivity"), ["Activity", "Hours"], Object.entries(rep.by_activity));
  table($("entries"), ["Date", "Start", "End", "Hours", "Project", "Activity", "Message"],
    ents.entries.slice().reverse().map((e) => [e.date, e.start, e.end ?? "running", e.hours, e.project, e.activity, e.message]));
}
async function post(path, body) {
  let res = await api(path, { method: "POST", body: JSON.stringify(body) });
  let data = await res.json();
  if (data.error && data.error.code === "project_required") {
    const p = prompt("Which project? Existing: " + data.error.projects.join(", "));
    if (!p) return;
    body.project = p; return post(path, body);
  }
  if (data.error && data.error.code === "project_not_found") {
    const hint = data.error.projects.length ? "Similar: " + data.error.projects.join(", ") + ". " : "";
    if (!confirm(hint + "Create new project '" + body.project + "'?")) return;
    body.create_project = true; return post(path, body);
  }
  if (data.error) { $("msg").textContent = data.error.message; $("msg").className = "err"; return; }
  $("msg").className = "muted"; $("msg").textContent = ""; await load();
}
$("save").onclick = async () => {
  token = $("token").value.trim();
  const res = await fetch("/api/activities", { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) { signOut("Invalid token"); return; }
  sessionStorage.setItem("oas_token", token); $("token").value = "";
  $("login").hidden = true; $("app").hidden = false; load();
};
$("refresh").onclick = load;
$("csv").onclick = async () => {
  const res = await api("/time/export.csv" + query());
  const url = URL.createObjectURL(await res.blob());
  const a = document.createElement("a"); a.href = url; a.download = "time-entries.csv"; a.click(); URL.revokeObjectURL(url);
};
$("log").onclick = () => post("/time", {
  activity: $("activity").value, project: $("project").value || null, date: $("date").value,
  from: $("start").value, to: $("end").value, message: $("message").value || null });
$("startTimer").onclick = () => post("/time/start", {
  activity: $("activity").value, project: $("project").value || null, message: $("message").value || null });
$("stopTimer").onclick = () => post("/time/stop", {});
$("date").value = new Date().toISOString().slice(0, 10);
if (token) { $("login").hidden = true; $("app").hidden = false; load().catch(() => {}); }
</script>
</body>
</html>
